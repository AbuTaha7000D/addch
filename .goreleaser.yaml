# GoReleaser configuration for the addch chapter toolkit.
# Builds addch, rmch, and getch for the documented 6-platform matrix and
# publishes one single ZIP archive per platform/architecture containing all
# three tools, a SHA256SUMS.txt over every artifact, and changelog from git
# summaries.

version: 2

project_name: addch

builds:
  - id: addch
    main: ./cmd/addch
    binary: addch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version=v{{ .Version }}"

  - id: rmch
    main: ./cmd/rmch
    binary: rmch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version=v{{ .Version }}"

  - id: getch
    main: ./cmd/getch
    binary: getch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version=v{{ .Version }}"

archives:
  - id: default
    ids:
      - addch
      - rmch
      - getch
    formats:
      - zip
    name_template: "addch-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS.txt"

changelog:
  use: git