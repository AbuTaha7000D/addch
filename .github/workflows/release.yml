name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for t in addch rmch getch; do
            go build -ldflags "-s -w -X main.version=$VERSION" -o $t-probe ./cmd/$t
            got="$(./$t-probe --version)"
            want="$t $VERSION"
            if [ "$got" != "$want" ]; then
              echo "::error::version mismatch for $t: got '$got', want '$want'"
              exit 1
            fi
            rm -f $t-probe
          done
          echo "probe binaries report version: $VERSION"

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
